<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="color-scheme" content="dark">
<title>Visitors</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
    background:#090909;
    color:#f4f4f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

main{
    width:min(1120px,calc(100% - 32px));
    margin:48px auto;
}

header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:18px;
}

h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:-.4px;
}

.total{
    color:#666;
    font-size:11px;
    text-align:right;
}

.total strong{
    display:block;
    margin-top:2px;
    color:#fafafa;
    font-size:25px;
    font-weight:600;
}

.panel{
    overflow:hidden;
    background:#0d0d0d;
    border:1px solid #1d1d1d;
    border-radius:12px;
}

.scroll{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:920px;
    border-collapse:collapse;
}

th{
    padding:13px 15px;
    color:#5f5f5f;
    border-bottom:1px solid #1d1d1d;
    text-align:left;
    font-size:10px;
    font-weight:600;
    letter-spacing:.55px;
}

td{
    padding:14px 15px;
    border-bottom:1px solid #171717;
    font-size:13px;
}

tbody tr:last-child td{
    border-bottom:0;
}

.country{
    display:flex;
    align-items:center;
    gap:10px;
}

.flag{
    width:27px;
    height:20px;
    flex:none;
    object-fit:cover;
    border-radius:3px;
    background:#151515;
}

.countryName{
    font-weight:500;
}

.countryCode{
    margin-top:2px;
    color:#555;
    font-size:10px;
}

.city,
.isp,
.time{
    color:#999;
}

.isp{
    max-width:220px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.badge{
    display:inline-flex;
    align-items:center;
    min-height:26px;
    padding:4px 8px;
    background:#151515;
    border:1px solid #242424;
    border-radius:6px;
    white-space:nowrap;
    font-size:11px;
}

.vpn{
    border-color:#403326;
}

.hosting{
    border-color:#32323e;
}

.normal{
    border-color:#24342a;
}

.time{
    white-space:nowrap;
}

.empty{
    padding:55px 20px;
    color:#555;
    text-align:center;
}

@media(max-width:650px){
    main{
        width:calc(100% - 20px);
        margin:26px auto;
    }

    h1{
        font-size:19px;
    }

    .total strong{
        font-size:22px;
    }
}
</style>
</head>

<body>

<main>

<header>

<h1>Visitors</h1>

<div class="total">
Total
<strong id="total">0</strong>
</div>

</header>

<div class="panel">

<div class="scroll">

<table>

<thead>
<tr>
<th>COUNTRY</th>
<th>CITY</th>
<th>SYSTEM</th>
<th>ISP</th>
<th>CONNECTION</th>
<th>DATE / TIME</th>
</tr>
</thead>

<tbody id="list">
<tr>
<td
    colspan="6"
    class="empty"
>
...
</td>
</tr>
</tbody>

</table>

</div>

</div>

</main>

<script>
const NAMESPACE=
    "mete-counter-x8k92m412";

const DB=
    `https://mantledb.sh/v2/${NAMESPACE}`;

function getDays(amount=30){
    const days=[];
    const d=new Date();

    for(let i=0;i<amount;i++){

        days.push(
            [
                d.getUTCFullYear(),
                String(
                    d.getUTCMonth()+1
                ).padStart(2,"0"),
                String(
                    d.getUTCDate()
                ).padStart(2,"0")
            ].join("-")
        );

        d.setUTCDate(
            d.getUTCDate()-1
        );
    }

    return days;
}

function getCountryName(code){
    if(
        !code ||
        code==="XX"
    ){
        return "Unknown";
    }

    try{
        return new Intl.DisplayNames(
            ["tr"],
            {
                type:"region"
            }
        ).of(code);
    }
    catch{
        return code;
    }
}

function createFlag(code){
    const img=
        document.createElement("img");

    img.className="flag";

    if(
        !code ||
        code==="XX" ||
        !/^[A-Z]{2}$/i.test(code)
    ){
        img.style.visibility=
            "hidden";

        return img;
    }

    img.src=
        `https://flagcdn.com/40x30/${code.toLowerCase()}.png`;

    img.alt=code;

    img.onerror=()=>{
        img.style.visibility=
            "hidden";
    };

    return img;
}

function createBadge(
    value,
    extra=""
){
    const badge=
        document.createElement("span");

    badge.className=
        `badge ${extra}`;

    badge.textContent=
        value||"Unknown";

    return badge;
}

function connectionClass(value){
    const v=
        String(value||"")
            .toLowerCase();

    if(v==="vpn"){
        return "vpn";
    }

    if(v==="hosting"){
        return "hosting";
    }

    if(v==="normal"){
        return "normal";
    }

    return "";
}

async function getTotal(){
    try{
        const response=
            await fetch(
                `${DB}/stats`,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            return null;
        }

        const data=
            await response.json();

        return Number(
            data.total||0
        );
    }
    catch{
        return null;
    }
}

async function getVisits(){
    const visits=[];

    const requests=
        getDays(30).map(
            async day=>{
                try{
                    const response=
                        await fetch(
                            `${DB}/visits/${day}`,
                            {
                                cache:"no-store"
                            }
                        );

                    if(!response.ok){
                        return;
                    }

                    const data=
                        await response.json();

                    if(
                        !data ||
                        typeof data!=="object"
                    ){
                        return;
                    }

                    Object
                        .values(data)
                        .forEach(
                            visit=>{
                                if(
                                    visit &&
                                    typeof visit==="object"
                                ){
                                    visits.push(
                                        visit
                                    );
                                }
                            }
                        );
                }
                catch{}
            }
        );

    await Promise.all(
        requests
    );

    visits.sort(
        (a,b)=>
            Number(b.timestamp||0)-
            Number(a.timestamp||0)
    );

    return visits;
}

async function load(){
    const [
        visits,
        savedTotal
    ]=await Promise.all([
        getVisits(),
        getTotal()
    ]);

    document
        .getElementById("total")
        .textContent=
            savedTotal===null
                ?visits.length
                :savedTotal;

    const list=
        document.getElementById(
            "list"
        );

    list.innerHTML="";

    if(!visits.length){
        const row=
            document.createElement("tr");

        const cell=
            document.createElement("td");

        cell.colSpan=6;
        cell.className="empty";
        cell.textContent=
            "No visitors";

        row.appendChild(cell);
        list.appendChild(row);

        return;
    }

    visits
        .slice(0,300)
        .forEach(
            visit=>{
                const row=
                    document.createElement("tr");

                const countryCell=
                    document.createElement("td");

                const country=
                    document.createElement("div");

                country.className=
                    "country";

                const text=
                    document.createElement("div");

                const name=
                    document.createElement("div");

                name.className=
                    "countryName";

                name.textContent=
                    getCountryName(
                        visit.country
                    );

                const code=
                    document.createElement("div");

                code.className=
                    "countryCode";

                code.textContent=
                    visit.country||
                    "--";

                text.append(
                    name,
                    code
                );

                country.append(
                    createFlag(
                        visit.country
                    ),
                    text
                );

                countryCell
                    .appendChild(
                        country
                    );

                const city=
                    document.createElement("td");

                city.className="city";

                city.textContent=
                    visit.city||
                    "Unknown";

                const systemCell=
                    document.createElement("td");

                systemCell.appendChild(
                    createBadge(
                        visit.os||
                        "Other"
                    )
                );

                const isp=
                    document.createElement("td");

                isp.className="isp";

                isp.textContent=
                    visit.isp||
                    "Unknown";

                isp.title=
                    visit.isp||
                    "Unknown";

                const connectionCell=
                    document.createElement("td");

                connectionCell.appendChild(
                    createBadge(
                        visit.connection||
                        "Unknown",
                        connectionClass(
                            visit.connection
                        )
                    )
                );

                const time=
                    document.createElement("td");

                time.className="time";

                time.textContent=
                    visit.datetime||
                    "-";

                row.append(
                    countryCell,
                    city,
                    systemCell,
                    isp,
                    connectionCell,
                    time
                );

                list.appendChild(
                    row
                );
            }
        );
}

load();

setInterval(
    load,
    5000
);
</script>

</body>
</html>
