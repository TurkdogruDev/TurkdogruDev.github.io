<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visitors</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#090909;
    color:#f4f4f5;
    font-family:Arial,Helvetica,sans-serif;
}

main{
    width:min(1100px,calc(100% - 32px));
    margin:48px auto;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    margin-bottom:20px;
}

h1{
    margin:0;
    font-size:22px;
    font-weight:600;
}

.total{
    color:#666;
    font-size:11px;
    text-align:right;
}

.total strong{
    display:block;
    margin-top:3px;
    color:#fff;
    font-size:26px;
    font-weight:600;
}

.panel{
    background:#0d0d0d;
    border:1px solid #1e1e1e;
    border-radius:12px;
    overflow:hidden;
}

.scroll{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    padding:13px 16px;
    color:#606060;
    font-size:10px;
    font-weight:600;
    text-align:left;
    letter-spacing:.5px;
    border-bottom:1px solid #1e1e1e;
}

td{
    padding:14px 16px;
    font-size:13px;
    border-bottom:1px solid #171717;
}

tbody tr:last-child td{
    border-bottom:0;
}

.country{
    display:flex;
    align-items:center;
    gap:10px;
}

.flag{
    width:27px;
    height:20px;
    object-fit:cover;
    border-radius:3px;
}

.country-name{
    font-weight:500;
}

.country-code{
    margin-top:2px;
    color:#555;
    font-size:10px;
}

.city,
.isp,
.time{
    color:#999;
}

.isp{
    max-width:220px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.tag{
    display:inline-block;
    padding:5px 8px;
    background:#151515;
    border:1px solid #242424;
    border-radius:6px;
    font-size:11px;
}

.time{
    white-space:nowrap;
}

.empty{
    padding:50px 20px;
    color:#555;
    text-align:center;
}

@media(max-width:650px){
    main{
        width:calc(100% - 20px);
        margin:25px auto;
    }
}
</style>
</head>

<body>

<main>

<header>
    <h1>Visitors</h1>

    <div class="total">
        Total
        <strong id="total">0</strong>
    </div>
</header>

<div class="panel">
<div class="scroll">

<table>
<thead>
<tr>
    <th>COUNTRY</th>
    <th>CITY</th>
    <th>SYSTEM</th>
    <th>ISP</th>
    <th>CONNECTION</th>
    <th>DATE / TIME</th>
</tr>
</thead>

<tbody id="list">
<tr>
    <td colspan="6" class="empty">...</td>
</tr>
</tbody>
</table>

</div>
</div>

</main>

<script>
const NAMESPACE="mete-counter-x8k92m412";
const DB=`https://mantledb.sh/v2/${NAMESPACE}`;

function getDays(amount=30){
    const days=[];
    const d=new Date();

    for(let i=0;i<amount;i++){
        days.push([
            d.getUTCFullYear(),
            String(d.getUTCMonth()+1).padStart(2,"0"),
            String(d.getUTCDate()).padStart(2,"0")
        ].join("-"));

        d.setUTCDate(d.getUTCDate()-1);
    }

    return days;
}

function getCountryName(visit){
    if(
        visit.countryName &&
        visit.countryName!=="Unknown"
    ){
        return visit.countryName;
    }

    if(
        !visit.country ||
        visit.country==="XX"
    ){
        return "Unknown";
    }

    try{
        return new Intl.DisplayNames(
            ["tr"],
            {type:"region"}
        ).of(visit.country);
    }catch{
        return visit.country;
    }
}

function createFlag(code){
    const img=document.createElement("img");

    img.className="flag";

    if(
        !code ||
        code==="XX" ||
        !/^[A-Z]{2}$/i.test(code)
    ){
        img.style.visibility="hidden";
        return img;
    }

    img.src=`https://flagcdn.com/40x30/${code.toLowerCase()}.png`;
    img.alt=code;

    img.onerror=()=>{
        img.style.visibility="hidden";
    };

    return img;
}

async function getTotal(){
    try{
        const response=await fetch(
            `${DB}/stats`,
            {cache:"no-store"}
        );

        if(!response.ok){
            return null;
        }

        const data=await response.json();

        return Number(data.total||0);
    }catch{
        return null;
    }
}

async function load(){
    const visits=[];

    await Promise.all(
        getDays(30).map(
            async day=>{
                try{
                    const response=await fetch(
                        `${DB}/visits/${day}`,
                        {cache:"no-store"}
                    );

                    if(!response.ok){
                        return;
                    }

                    const data=await response.json();

                    Object.values(data).forEach(
                        visit=>visits.push(visit)
                    );
                }catch{}
            }
        )
    );

    visits.sort(
        (a,b)=>
            (b.timestamp||0)-
            (a.timestamp||0)
    );

    const savedTotal=await getTotal();

    document.getElementById("total").textContent=
        savedTotal===null
            ?visits.length
            :savedTotal;

    const list=document.getElementById("list");

    list.innerHTML="";

    if(!visits.length){
        const row=document.createElement("tr");
        const cell=document.createElement("td");

        cell.colSpan=6;
        cell.className="empty";
        cell.textContent="No visitors";

        row.appendChild(cell);
        list.appendChild(row);

        return;
    }

    visits.slice(0,300).forEach(visit=>{
        const row=document.createElement("tr");

        const countryCell=document.createElement("td");
        const countryWrap=document.createElement("div");
        const countryText=document.createElement("div");
        const countryName=document.createElement("div");
        const countryCode=document.createElement("div");

        countryWrap.className="country";
        countryName.className="country-name";
        countryCode.className="country-code";

        countryName.textContent=getCountryName(visit);
        countryCode.textContent=visit.country||"--";

        countryText.append(
            countryName,
            countryCode
        );

        countryWrap.append(
            createFlag(visit.country),
            countryText
        );

        countryCell.appendChild(countryWrap);

        const city=document.createElement("td");

        city.className="city";
        city.textContent=visit.city||"Unknown";

        const systemCell=document.createElement("td");
        const system=document.createElement("span");

        system.className="tag";
        system.textContent=visit.os||"Other";

        systemCell.appendChild(system);

        const isp=document.createElement("td");

        isp.className="isp";
        isp.textContent=visit.isp||"Unknown";
        isp.title=visit.isp||"Unknown";

        const connectionCell=document.createElement("td");
        const connection=document.createElement("span");

        connection.className="tag";
        connection.textContent=visit.connection||"Unknown";

        connectionCell.appendChild(connection);

        const time=document.createElement("td");

        time.className="time";
        time.textContent=visit.datetime||"-";

        row.append(
            countryCell,
            city,
            systemCell,
            isp,
            connectionCell,
            time
        );

        list.appendChild(row);
    });
}

load();

setInterval(load,5000);
</script>

</body>
</html>
