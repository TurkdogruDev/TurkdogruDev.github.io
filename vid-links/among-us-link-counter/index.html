<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">

<title>Visitors</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#090909;
    color:#eee;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

main{
    width:min(
        1100px,
        calc(100% - 28px)
    );
    margin:45px auto;
}

header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:18px;
}

h1{
    margin:0;
    font-size:21px;
    font-weight:600;
}

.total{
    color:#666;
    font-size:11px;
    text-align:right;
}

.total strong{
    display:block;
    margin-top:2px;
    color:#fff;
    font-size:25px;
}

.panel{
    overflow:hidden;
    background:#0d0d0d;
    border:1px solid #1d1d1d;
    border-radius:12px;
}

.scroll{
    overflow-x:auto;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:collapse;
}

th{
    padding:13px 15px;
    text-align:left;
    color:#5d5d5d;
    font-size:10px;
    letter-spacing:.5px;
    border-bottom:1px solid #1d1d1d;
}

td{
    padding:14px 15px;
    font-size:13px;
    border-bottom:1px solid #171717;
}

.country{
    display:flex;
    align-items:center;
    gap:10px;
}

.flag{
    width:27px;
    height:20px;
    object-fit:cover;
    border-radius:3px;
}

.name{
    font-weight:500;
}

.code{
    margin-top:2px;
    color:#555;
    font-size:10px;
}

.city,
.isp,
.time{
    color:#999;
}

.tag{
    display:inline-block;
    padding:5px 8px;
    background:#151515;
    border:1px solid #242424;
    border-radius:6px;
    font-size:11px;
}

.time{
    white-space:nowrap;
}

.empty{
    padding:50px;
    text-align:center;
    color:#555;
}

@media(max-width:650px){
    main{
        width:calc(100% - 18px);
        margin:25px auto;
    }
}
</style>
</head>

<body>

<main>

<header>

<h1>Visitors</h1>

<div class="total">
Total
<strong id="total">0</strong>
</div>

</header>

<div class="panel">
<div class="scroll">

<table>

<thead>
<tr>
<th>COUNTRY</th>
<th>CITY</th>
<th>SYSTEM</th>
<th>ISP</th>
<th>CONNECTION</th>
<th>DATE / TIME</th>
</tr>
</thead>

<tbody id="list">

<tr>
<td colspan="6" class="empty">
...
</td>
</tr>

</tbody>

</table>

</div>
</div>

</main>

<script>
const NAMESPACE=
    "mete-counter-x8k92m413";

const DB=
    `https://mantledb.sh/v2/${NAMESPACE}`;

function days(amount=30){
    const result=[];
    const d=new Date();

    for(let i=0;i<amount;i++){

        result.push(
            [
                d.getUTCFullYear(),
                String(
                    d.getUTCMonth()+1
                ).padStart(2,"0"),
                String(
                    d.getUTCDate()
                ).padStart(2,"0")
            ].join("-")
        );

        d.setUTCDate(
            d.getUTCDate()-1
        );
    }

    return result;
}

function flagFor(visit){
    const img=
        document.createElement("img");

    img.className="flag";

    if(visit.flag){
        img.src=visit.flag;
    }
    else if(
        /^[A-Z]{2}$/i.test(
            visit.country||""
        )
    ){
        img.src=
            `https://flagcdn.com/40x30/${visit.country.toLowerCase()}.png`;
    }

    img.alt=
        visit.country||"";

    img.onerror=()=>{
        img.style.visibility=
            "hidden";
    };

    return img;
}

async function getTotal(){
    try{
        const r=
            await fetch(
                `${DB}/stats`,
                {
                    cache:"no-store"
                }
            );

        if(!r.ok){
            return null;
        }

        const data=
            await r.json();

        return Number(
            data.total||0
        );
    }
    catch{
        return null;
    }
}

async function getVisits(){
    const visits=[];

    await Promise.all(
        days().map(
            async day=>{
                try{
                    const r=
                        await fetch(
                            `${DB}/visits/${day}`,
                            {
                                cache:"no-store"
                            }
                        );

                    if(!r.ok){
                        return;
                    }

                    const data=
                        await r.json();

                    Object
                        .values(data)
                        .forEach(
                            v=>{
                                if(v){
                                    visits.push(v);
                                }
                            }
                        );
                }
                catch{}
            }
        )
    );

    visits.sort(
        (a,b)=>
            Number(b.timestamp||0)-
            Number(a.timestamp||0)
    );

    return visits;
}

function tag(value){
    const span=
        document.createElement("span");

    span.className="tag";

    span.textContent=
        value||"Unknown";

    return span;
}

async function load(){
    const [
        visits,
        total
    ]=
        await Promise.all([
            getVisits(),
            getTotal()
        ]);

    document
        .getElementById("total")
        .textContent=
            total===null
                ?visits.length
                :total;

    const list=
        document.getElementById(
            "list"
        );

    list.innerHTML="";

    if(!visits.length){
        const row=
            document.createElement("tr");

        const cell=
            document.createElement("td");

        cell.colSpan=6;
        cell.className="empty";
        cell.textContent=
            "No visitors";

        row.appendChild(cell);
        list.appendChild(row);

        return;
    }

    visits
        .slice(0,300)
        .forEach(
            visit=>{
                const row=
                    document.createElement("tr");

                const countryCell=
                    document.createElement("td");

                const country=
                    document.createElement("div");

                country.className=
                    "country";

                const text=
                    document.createElement("div");

                const name=
                    document.createElement("div");

                name.className="name";

                name.textContent=
                    visit.countryName||
                    visit.country||
                    "Unknown";

                const code=
                    document.createElement("div");

                code.className="code";

                code.textContent=
                    visit.country||
                    "--";

                text.append(
                    name,
                    code
                );

                country.append(
                    flagFor(visit),
                    text
                );

                countryCell.appendChild(
                    country
                );

                const city=
                    document.createElement("td");

                city.className="city";

                city.textContent=
                    visit.city||
                    "Unknown";

                const system=
                    document.createElement("td");

                system.appendChild(
                    tag(visit.os)
                );

                const isp=
                    document.createElement("td");

                isp.className="isp";

                isp.textContent=
                    visit.isp||
                    "Unknown";

                const connection=
                    document.createElement("td");

                connection.appendChild(
                    tag(
                        visit.connection
                    )
                );

                const time=
                    document.createElement("td");

                time.className="time";

                time.textContent=
                    visit.datetime||
                    "-";

                row.append(
                    countryCell,
                    city,
                    system,
                    isp,
                    connection,
                    time
                );

                list.appendChild(row);
            }
        );
}

load();

setInterval(
    load,
    5000
);
</script>

</body>
</html>
