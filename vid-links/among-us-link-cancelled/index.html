<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="color-scheme" content="dark">
<title>T.Dev</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#090909;
    color:#f4f4f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    text-align:center;
}

.icon{
    width:46px;
    height:46px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #5a2020;
    border-radius:50%;
    background:#1a0d0d;
    color:#ff4d4d;
    font-size:27px;
    font-weight:400;
    line-height:1;
    box-shadow:0 0 0 4px rgba(255,77,77,.03);
}

h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:-.3px;
}

p{
    margin:12px 0 0;
    color:#8f8f8f;
    font-size:14px;
    line-height:1.6;
}

small{
    display:block;
    margin-top:20px;
    color:#555;
    font-size:12px;
}

@media(max-width:480px){
    body{
        padding:18px;
    }

    .box{
        max-width:350px;
    }

    h1{
        font-size:19px;
    }

    p{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="box">

<div class="icon">×</div>

<h1>İşlem İptal Edildi</h1>

<p>
Ziyaret istatistiklerinin işlenmesine izin verilmediği için
proje bağlantısına yönlendirme yapılmadı.
</p>

<small>
Herhangi bir ziyaret verisi kaydedilmedi.
</small>

</div>

</body>
</html>
