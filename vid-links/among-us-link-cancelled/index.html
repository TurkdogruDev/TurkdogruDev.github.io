<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title>T.Dev</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#090909;
    color:#f4f4f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    text-align:center;
}

.icon{
    width:42px;
    height:42px;
    margin:0 auto 18px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #2a2a2a;
    border-radius:50%;
    color:#888;
    font-size:20px;
}

h1{
    margin:0;
    font-size:21px;
    font-weight:600;
    letter-spacing:-.3px;
}

p{
    margin:12px 0 0;
    color:#8f8f8f;
    font-size:14px;
    line-height:1.6;
}

small{
    display:block;
    margin-top:20px;
    color:#555;
    font-size:12px;
}
</style>
</head>

<body>

<div class="box">

<div class="icon">×</div>

<h1>İşlem İptal Edildi</h1>

<p>
Ziyaret istatistiklerinin işlenmesine izin verilmediği için
proje bağlantısına yönlendirme yapılmadı.
</p>

<small>
Bu sekmeyi güvenle kapatabilirsiniz.
</small>

</div>

</body>
</html>
