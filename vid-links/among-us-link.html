<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#090909;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader{
    width:20px;
    height:20px;
    border:2px solid #222;
    border-top-color:#777;
    border-radius:50%;
    animation:spin .65s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="loader"></div>

<script>
const NAMESPACE="mete-counter-x8k92m412";
const REDIRECT="https://www.mediafire.com/file/zpdvgqnlmlkye70/T_Dev_Among_Us_v2026.8.18_Signed_Menu_v22.apk/file";
const DB=`https://mantledb.sh/v2/${NAMESPACE}`;

async function getOS(){
    const ua=navigator.userAgent||"";
    let platform=navigator.platform||"";

    if(navigator.userAgentData){
        try{
            const data=await navigator.userAgentData.getHighEntropyValues([
                "platform",
                "mobile",
                "model"
            ]);

            if(data.platform){
                platform=data.platform;
            }
        }catch{}
    }

    const value=(ua+" "+platform).toLowerCase();

    if(value.includes("android")){
        return "Android";
    }

    if(
        value.includes("iphone")||
        value.includes("ipad")||
        value.includes("ipod")
    ){
        return "iOS";
    }

    if(
        platform==="MacIntel" &&
        navigator.maxTouchPoints>1
    ){
        return "iOS";
    }

    if(value.includes("windows")){
        return "Windows";
    }

    if(
        value.includes("macintosh")||
        value.includes("mac os")||
        value.includes("macintel")
    ){
        return "Mac";
    }

    if(value.includes("linux")){
        return "Linux";
    }

    return "Other";
}

function getDay(){
    const d=new Date();

    return[
        d.getUTCFullYear(),
        String(d.getUTCMonth()+1).padStart(2,"0"),
        String(d.getUTCDate()).padStart(2,"0")
    ].join("-");
}

function getDateTime(){
    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    ).format(new Date());
}

async function getNetwork(){
    const controller=new AbortController();

    const timeout=setTimeout(
        ()=>controller.abort(),
        1100
    );

    try{
        const response=await fetch(
            "https://ipsnapshot.com/api/ip/self",
            {
                signal:controller.signal,
                cache:"no-store"
            }
        );

        clearTimeout(timeout);

        if(!response.ok){
            throw new Error();
        }

        const result=await response.json();
        const data=result.data||{};

        let connection="Normal";

        if(data.is_tor===true){
            connection="Tor";
        }else if(data.is_vpn===true){
            connection="VPN";
        }else if(data.is_datacenter===true){
            connection="Hosting";
        }

        return{
            country:data.country_code||"XX",
            countryName:data.country||"Unknown",
            city:data.city||"Unknown",
            isp:data.isp||"Unknown",
            connection:connection
        };
    }catch{
        clearTimeout(timeout);

        return{
            country:"XX",
            countryName:"Unknown",
            city:"Unknown",
            isp:"Unknown",
            connection:"Unknown"
        };
    }
}

async function saveVisit(){
    const [network,system]=await Promise.all([
        getNetwork(),
        getOS()
    ]);

    const visit={
        timestamp:Date.now(),
        datetime:getDateTime(),
        country:network.country,
        countryName:network.countryName,
        city:network.city,
        os:system,
        isp:network.isp,
        connection:network.connection
    };

    const id=crypto.randomUUID
        ?crypto.randomUUID()
        :`${Date.now()}-${Math.random().toString(36).slice(2)}`;

    const data={};
    data[id]=visit;

    const endpoint=
        `${DB}/visits/${getDay()}`;

    let response=await fetch(
        endpoint,
        {
            method:"PATCH",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(data),
            keepalive:true
        }
    );

    if(response.status===404){
        await fetch(
            endpoint,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(data),
                keepalive:true
            }
        );
    }

    await fetch(
        `https://mantledb.sh/v2/increment/${NAMESPACE}/stats`,
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                key:"total",
                by:1
            }),
            keepalive:true
        }
    );
}

function wait(ms){
    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );
}

(async()=>{
    const started=Date.now();

    await Promise.race([
        saveVisit(),
        wait(5000)
    ]);

    const elapsed=Date.now()-started;

    if(elapsed<5000){
        await wait(5000-elapsed);
    }

    window.location.replace(REDIRECT);
})();
</script>

</body>
</html>
