<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="color-scheme" content="dark">
<title></title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    min-height:100%;
    background:#090909;
    color:#f4f4f5;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    margin:auto;
    text-align:center;
}

h1{
    margin:0 0 12px;
    font-size:20px;
    font-weight:600;
    letter-spacing:-.3px;
}

p{
    width:100%;
    margin:0 auto;
    color:#9a9a9a;
    font-size:14px;
    line-height:1.6;
}

.actions{
    width:100%;
    display:flex;
    align-items:stretch;
    justify-content:center;
    gap:10px;
    margin-top:24px;
}

button{
    min-height:46px;
    border:1px solid #282828;
    border-radius:9px;
    font-family:inherit;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    transition:
        background .2s,
        color .2s,
        border-color .2s,
        opacity .2s;
}

#cancel{
    width:100px;
    flex:none;
    background:#111;
    color:#aaa;
}

#accept{
    flex:1;
    min-width:0;
    background:#f4f4f5;
    color:#090909;
    border-color:#f4f4f5;
}

#accept:disabled{
    background:#151515;
    color:#555;
    border-color:#222;
    cursor:not-allowed;
}

#accept.loading{
    opacity:.65;
    pointer-events:none;
}

@media(max-width:480px){
    body{
        padding:18px;
    }

    .box{
        max-width:360px;
    }

    h1{
        font-size:19px;
    }

    p{
        font-size:13px;
        line-height:1.55;
    }

    .actions{
        flex-direction:column;
    }

    #cancel,
    #accept{
        width:100%;
        flex:none;
    }

    #accept{
        order:1;
    }

    #cancel{
        order:2;
    }
}

@media(max-height:520px){
    body{
        height:auto;
        min-height:100vh;
        align-items:flex-start;
        padding-top:25px;
        padding-bottom:25px;
    }
}
</style>
</head>

<body>

<div class="box">

<h1>Ziyaret İstatistikleri</h1>

<p>
Ülke, şehir, ISP, VPN/hosting durumu ve tarih-saat bilgileri,
videodan proje bağlantısına gelen trafiği ve videoya gelen etkileşimi
değerlendirmek için kaydedilir. IP adresiniz saklanmaz.
“Kabul Et ve Yönlendir” butonuna basarak bunu kabul edersiniz.
</p>

<div class="actions">

<button id="cancel" type="button">
İptal
</button>

<button id="accept" type="button" disabled>
3
</button>

</div>

</div>

<script>
const NAMESPACE="mete-counter-x8k92m413";

const REDIRECT=
"https://www.mediafire.com/file/zpdvgqnlmlkye70/T_Dev_Among_Us_v2026.8.18_Signed_Menu_v22.apk/file";

const DB=
`https://mantledb.sh/v2/${NAMESPACE}`;

function getOS(){
    const ua=
        (navigator.userAgent||"").toLowerCase();

    const platform=(
        navigator.userAgentData?.platform||
        navigator.platform||
        ""
    ).toLowerCase();

    if(
        ua.includes("android")||
        platform.includes("android")
    ){
        return "Android";
    }

    if(
        ua.includes("iphone")||
        ua.includes("ipad")||
        ua.includes("ipod")
    ){
        return "iOS";
    }

    if(
        platform==="macintel" &&
        navigator.maxTouchPoints>1
    ){
        return "iOS";
    }

    if(
        ua.includes("windows")||
        platform.includes("win")
    ){
        return "Windows";
    }

    if(
        ua.includes("macintosh")||
        ua.includes("mac os")||
        platform.includes("mac")
    ){
        return "Mac";
    }

    if(
        ua.includes("linux")||
        platform.includes("linux")
    ){
        return "Linux";
    }

    return "Other";
}

function getDay(){
    const d=new Date();

    return[
        d.getUTCFullYear(),
        String(
            d.getUTCMonth()+1
        ).padStart(2,"0"),
        String(
            d.getUTCDate()
        ).padStart(2,"0")
    ].join("-");
}

function getDateTime(){
    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    ).format(new Date());
}

async function fetchJSON(
    url,
    timeout=1400
){
    const controller=
        new AbortController();

    const timer=
        setTimeout(
            ()=>controller.abort(),
            timeout
        );

    try{
        const response=
            await fetch(
                url,
                {
                    signal:controller.signal,
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error();
        }

        return await response.json();
    }
    finally{
        clearTimeout(timer);
    }
}

async function getNetwork(){
    const results=
        await Promise.allSettled([
            fetchJSON(
                "https://ipwho.is/",
                1400
            ),

            fetchJSON(
                "https://hackmyip.com/api/ip",
                1400
            )
        ]);

    let country="XX";
    let countryName="Unknown";
    let city="Unknown";
    let isp="Unknown";
    let flag="";
    let connection="Unknown";

    if(
        results[0].status===
        "fulfilled"
    ){
        const geo=
            results[0].value||{};

        if(geo.success!==false){
            country=
                geo.country_code||
                "XX";

            countryName=
                geo.country||
                "Unknown";

            city=
                geo.city||
                "Unknown";

            isp=
                geo.connection?.isp||
                geo.connection?.org||
                "Unknown";

            flag=
                geo.flag?.img||
                "";
        }
    }

    if(
        results[1].status===
        "fulfilled"
    ){
        const privacy=
            results[1].value
                ?.data
                ?.privacy||
            {};

        if(
            privacy.is_vpn===true
        ){
            connection="VPN";
        }
        else if(
            privacy.is_datacenter===
            true
        ){
            connection="Hosting";
        }
        else if(
            privacy.is_residential===
            true
        ){
            connection="Normal";
        }
    }

    return{
        country,
        countryName,
        city,
        isp,
        flag,
        connection
    };
}

async function saveVisit(){
    const network=
        await getNetwork();

    const visit={
        timestamp:Date.now(),
        datetime:getDateTime(),
        country:network.country,
        countryName:
            network.countryName,
        city:network.city,
        os:getOS(),
        isp:network.isp,
        flag:network.flag,
        connection:
            network.connection
    };

    const id=
        crypto.randomUUID
            ?crypto.randomUUID()
            :`${Date.now()}-${Math.random()
                .toString(36)
                .slice(2)}`;

    const body={};

    body[id]=visit;

    const endpoint=
        `${DB}/visits/${getDay()}`;

    let response=
        await fetch(
            endpoint,
            {
                method:"PATCH",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(body),

                keepalive:true
            }
        );

    if(
        response.status===404
    ){
        response=
            await fetch(
                endpoint,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(body),

                    keepalive:true
                }
            );
    }

    if(response.ok){
        await fetch(
            `https://mantledb.sh/v2/increment/${NAMESPACE}/stats`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({
                        key:"total",
                        by:1
                    }),

                keepalive:true
            }
        );
    }
}

const accept=
    document.getElementById(
        "accept"
    );

const cancel=
    document.getElementById(
        "cancel"
    );

let seconds=3;

accept.textContent=
    seconds;

const countdown=
    setInterval(
        ()=>{
            seconds--;

            if(seconds>0){
                accept.textContent=
                    seconds;
            }
            else{
                clearInterval(
                    countdown
                );

                accept.disabled=
                    false;

                accept.textContent=
                    "Kabul Et ve Yönlendir";
            }
        },
        1000
    );

cancel.addEventListener(
    "click",
    ()=>{
        if(
            document.referrer
        ){
            history.back();
        }
        else{
            window.location.href=
                "about:blank";
        }
    }
);

accept.addEventListener(
    "click",
    async()=>{
        if(
            accept.disabled
        ){
            return;
        }

        accept.disabled=true;

        cancel.disabled=true;

        accept.classList.add(
            "loading"
        );

        accept.textContent=
            "Yönlendiriliyor...";

        try{
            await Promise.race([
                saveVisit(),

                new Promise(
                    resolve=>
                        setTimeout(
                            resolve,
                            1800
                        )
                )
            ]);
        }
        catch{}

        window.location.replace(
            REDIRECT
        );
    }
);
</script>

</body>
</html>
