<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<meta name="color-scheme" content="dark">
<title></title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#090909;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader{
    width:20px;
    height:20px;
    border:2px solid #232323;
    border-top-color:#777;
    border-radius:50%;
    animation:spin .65s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="loader"></div>

<script>
const NAMESPACE="mete-counter-x8k92m412";

const REDIRECT="https://www.mediafire.com/file/zpdvgqnlmlkye70/T_Dev_Among_Us_v2026.8.18_Signed_Menu_v22.apk/file";

const DB=`https://mantledb.sh/v2/${NAMESPACE}`;

function getOS(){
    const ua=(navigator.userAgent||"").toLowerCase();

    const platform=(
        navigator.userAgentData?.platform||
        navigator.platform||
        ""
    ).toLowerCase();

    if(
        ua.includes("android")||
        platform.includes("android")
    ){
        return "Android";
    }

    if(
        ua.includes("iphone")||
        ua.includes("ipad")||
        ua.includes("ipod")
    ){
        return "iOS";
    }

    if(
        platform==="macintel" &&
        navigator.maxTouchPoints>1
    ){
        return "iOS";
    }

    if(
        platform.includes("win")||
        ua.includes("windows")
    ){
        return "Windows";
    }

    if(
        platform.includes("mac")||
        ua.includes("macintosh")||
        ua.includes("mac os x")
    ){
        return "Mac";
    }

    if(
        platform.includes("linux")||
        ua.includes("linux")
    ){
        return "Linux";
    }

    return "Other";
}

function getDay(){
    const d=new Date();

    return [
        d.getUTCFullYear(),
        String(d.getUTCMonth()+1).padStart(2,"0"),
        String(d.getUTCDate()).padStart(2,"0")
    ].join("-");
}

function getDateTime(){
    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    ).format(new Date());
}

async function getNetwork(){
    const controller=new AbortController();

    const timeout=setTimeout(
        ()=>controller.abort(),
        900
    );

    try{
        const response=await fetch(
            "https://hackmyip.com/api/ip",
            {
                signal:controller.signal,
                cache:"no-store"
            }
        );

        clearTimeout(timeout);

        if(!response.ok){
            throw new Error("Network lookup failed");
        }

        const result=await response.json();

        const data=result.data||{};
        const location=data.location||{};
        const network=data.network||{};
        const privacy=data.privacy||{};

        let connection="Unknown";

        if(privacy.is_vpn===true){
            connection="VPN";
        }
        else if(privacy.is_datacenter===true){
            connection="Hosting";
        }
        else if(privacy.is_residential===true){
            connection="Normal";
        }
        else if(privacy.type){
            connection=String(privacy.type);
        }

        return{
            country:location.country||"XX",
            city:location.city||"Unknown",
            isp:network.isp||"Unknown",
            connection:connection
        };
    }
    catch{
        clearTimeout(timeout);

        return{
            country:"XX",
            city:"Unknown",
            isp:"Unknown",
            connection:"Unknown"
        };
    }
}

async function saveVisit(){
    const network=await getNetwork();

    const visit={
        timestamp:Date.now(),
        datetime:getDateTime(),
        country:network.country,
        city:network.city,
        os:getOS(),
        isp:network.isp,
        connection:network.connection
    };

    const id=
        typeof crypto!=="undefined" &&
        typeof crypto.randomUUID==="function"
            ?crypto.randomUUID()
            :`${Date.now()}-${Math.random().toString(36).slice(2)}`;

    const data={};

    data[id]=visit;

    const endpoint=
        `${DB}/visits/${getDay()}`;

    try{
        const response=await fetch(
            endpoint,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(data),
                keepalive:true
            }
        );

        if(response.status===404){
            await fetch(
                endpoint,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify(data),
                    keepalive:true
                }
            );
        }

        await fetch(
            `https://mantledb.sh/v2/increment/${NAMESPACE}/stats`,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    key:"total",
                    by:1
                }),
                keepalive:true
            }
        );
    }
    catch{}
}

function wait(ms){
    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );
}

(async()=>{
    const started=Date.now();

    await Promise.race([
        saveVisit(),
        wait(1800)
    ]);

    const elapsed=
        Date.now()-started;

    if(elapsed<2000){
        await wait(
            2000-elapsed
        );
    }

    window.location.replace(
        REDIRECT
    );
})();
</script>

</body>
</html>
