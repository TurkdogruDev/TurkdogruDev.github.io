<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090909">
<title></title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#090909;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

.loader{
    width:20px;
    height:20px;
    border:2px solid #222;
    border-top-color:#777;
    border-radius:50%;
    animation:spin .65s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="loader"></div>

<script>
const NAMESPACE="mete-counter-x8k92m413";

const REDIRECT=
"https://www.mediafire.com/file/zpdvgqnlmlkye70/T_Dev_Among_Us_v2026.8.18_Signed_Menu_v22.apk/file";

const DB=
`https://mantledb.sh/v2/${NAMESPACE}`;

function getOS(){
    const ua=
        (navigator.userAgent||"").toLowerCase();

    const platform=
        (
            navigator.userAgentData?.platform||
            navigator.platform||
            ""
        ).toLowerCase();

    if(
        ua.includes("android")||
        platform.includes("android")
    ){
        return "Android";
    }

    if(
        ua.includes("iphone")||
        ua.includes("ipad")||
        ua.includes("ipod")
    ){
        return "iOS";
    }

    if(
        platform==="macintel" &&
        navigator.maxTouchPoints>1
    ){
        return "iOS";
    }

    if(
        ua.includes("windows")||
        platform.includes("win")
    ){
        return "Windows";
    }

    if(
        ua.includes("macintosh")||
        platform.includes("mac")
    ){
        return "Mac";
    }

    if(
        ua.includes("linux")||
        platform.includes("linux")
    ){
        return "Linux";
    }

    return "Other";
}

function getDay(){
    const d=new Date();

    return [
        d.getUTCFullYear(),
        String(
            d.getUTCMonth()+1
        ).padStart(2,"0"),
        String(
            d.getUTCDate()
        ).padStart(2,"0")
    ].join("-");
}

function getDateTime(){
    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:false
        }
    ).format(new Date());
}

async function fetchJSON(url,timeoutMs=1300){
    const controller=
        new AbortController();

    const timeout=
        setTimeout(
            ()=>controller.abort(),
            timeoutMs
        );

    try{
        const response=
            await fetch(
                url,
                {
                    signal:
                        controller.signal,
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error();
        }

        return await response.json();
    }
    finally{
        clearTimeout(timeout);
    }
}

async function getNetwork(){
    const results=
        await Promise.allSettled([
            fetchJSON(
                "https://ipwho.is/",
                1300
            ),
            fetchJSON(
                "https://hackmyip.com/api/ip",
                1300
            )
        ]);

    let country="XX";
    let countryName="Unknown";
    let city="Unknown";
    let isp="Unknown";
    let flag="";
    let connection="Unknown";

    if(
        results[0].status==="fulfilled"
    ){
        const geo=
            results[0].value||{};

        if(geo.success!==false){
            country=
                geo.country_code||
                "XX";

            countryName=
                geo.country||
                "Unknown";

            city=
                geo.city||
                "Unknown";

            isp=
                geo.connection?.isp||
                geo.connection?.org||
                "Unknown";

            flag=
                geo.flag?.img||
                "";
        }
    }

    if(
        results[1].status==="fulfilled"
    ){
        const privacy=
            results[1].value?.data?.privacy||
            {};

        if(privacy.is_vpn===true){
            connection="VPN";
        }
        else if(
            privacy.is_datacenter===true
        ){
            connection="Hosting";
        }
        else if(
            privacy.is_residential===true
        ){
            connection="Normal";
        }
    }

    return{
        country,
        countryName,
        city,
        isp,
        flag,
        connection
    };
}

async function saveVisit(){
    const network=
        await getNetwork();

    const visit={
        timestamp:Date.now(),
        datetime:getDateTime(),
        country:network.country,
        countryName:network.countryName,
        city:network.city,
        os:getOS(),
        isp:network.isp,
        flag:network.flag,
        connection:network.connection
    };

    const id=
        crypto.randomUUID
            ?crypto.randomUUID()
            :`${Date.now()}-${Math.random()
                .toString(36)
                .slice(2)}`;

    const body={};

    body[id]=visit;

    const endpoint=
        `${DB}/visits/${getDay()}`;

    let response=
        await fetch(
            endpoint,
            {
                method:"PATCH",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify(body),
                keepalive:true
            }
        );

    if(response.status===404){
        response=
            await fetch(
                endpoint,
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:
                        JSON.stringify(body),
                    keepalive:true
                }
            );
    }

    if(response.ok){
        await fetch(
            `https://mantledb.sh/v2/increment/${NAMESPACE}/stats`,
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    key:"total",
                    by:1
                }),
                keepalive:true
            }
        );
    }
}

function wait(ms){
    return new Promise(
        resolve=>setTimeout(resolve,ms)
    );
}

(async()=>{
    const started=
        Date.now();

    await Promise.race([
        saveVisit(),
        wait(1850)
    ]);

    const passed=
        Date.now()-started;

    if(passed<2000){
        await wait(
            2000-passed
        );
    }

    window.location.replace(
        REDIRECT
    );
})();
</script>

</body>
</html>
