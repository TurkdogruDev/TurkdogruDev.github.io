<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #09090b;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.loader {
    width: 26px;
    height: 26px;
    border: 2px solid #202024;
    border-top-color: #888;
    border-radius: 50%;
    animation: spin .7s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
</style>
</head>

<body>

<div class="loader"></div>

<script>
const NAMESPACE = "mete-x7k92m41-counter";
const REDIRECT = "https://www.mediafire.com/file/zpdvgqnlmlkye70/T_Dev_Among_Us_v2026.8.18_Signed_Menu_v22.apk/file";
const DB = `https://mantledb.sh/v2/${NAMESPACE}`;

async function getSystem() {
    const ua = navigator.userAgent || "";
    const platform = navigator.platform || "";
    const touch = navigator.maxTouchPoints || 0;

    if (navigator.userAgentData) {
        try {
            const data =
                await navigator.userAgentData.getHighEntropyValues([
                    "platform",
                    "mobile",
                    "model"
                ]);

            const p =
                (data.platform || "").toLowerCase();

            if (p.includes("android")) {
                return "Android";
            }

            if (p.includes("windows")) {
                return "Windows";
            }

            if (p.includes("mac")) {
                return "Mac";
            }

            if (p.includes("linux")) {
                return "Linux";
            }

            if (data.mobile && /android/i.test(ua)) {
                return "Android";
            }
        } catch {}
    }

    if (/android/i.test(ua)) {
        return "Android";
    }

    if (/iphone|ipad|ipod/i.test(ua)) {
        return "iOS";
    }

    if (
        platform === "MacIntel" &&
        touch > 1
    ) {
        return "iOS";
    }

    if (/windows/i.test(ua + " " + platform)) {
        return "Windows";
    }

    if (/macintosh|mac os x|macintel/i.test(
        ua + " " + platform
    )) {
        return "Mac";
    }

    if (/linux/i.test(ua + " " + platform)) {
        return "Linux";
    }

    return "Other";
}

function getMonth() {
    const d = new Date();

    return (
        d.getUTCFullYear() +
        "-" +
        String(
            d.getUTCMonth() + 1
        ).padStart(2, "0")
    );
}

function getDateTime() {
    const now = new Date();

    return new Intl.DateTimeFormat(
        "tr-TR",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: false
        }
    ).format(now);
}

async function getLocation() {
    try {
        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                () => controller.abort(),
                1000
            );

        const response =
            await fetch(
                "https://api.country.is/?fields=city",
                {
                    signal:
                        controller.signal
                }
            );

        clearTimeout(timeout);

        const data =
            await response.json();

        return {
            country:
                data.country || "XX",

            city:
                data.city || "Unknown"
        };
    } catch {
        return {
            country: "XX",
            city: "Unknown"
        };
    }
}

async function saveVisit() {
    const location =
        await getLocation();

    const system =
        await getSystem();

    const visit = {
        timestamp: Date.now(),

        datetime:
            getDateTime(),

        timezone:
            Intl.DateTimeFormat()
                .resolvedOptions()
                .timeZone,

        country:
            location.country,

        city:
            location.city,

        os:
            system
    };

    const id =
        crypto.randomUUID
            ? crypto.randomUUID()
            : (
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .slice(2)
            );

    const data = {};

    data[id] = visit;

    const endpoint =
        `${DB}/visits/${getMonth()}`;

    let response =
        await fetch(
            endpoint,
            {
                method: "PATCH",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data),

                keepalive: true
            }
        );

    if (response.status === 404) {
        await fetch(
            endpoint,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(data),

                keepalive: true
            }
        );
    }
}

function wait(ms) {
    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}

(async () => {
    await Promise.race([
        saveVisit(),
        wait(1800)
    ]);

    await wait(150);

    window.location.replace(
        REDIRECT
    );
})();
</script>

</body>
</html>
