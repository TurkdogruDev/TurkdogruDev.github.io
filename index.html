<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>T.Dev</title>

    <!-- Yeni tarayıcılar -->
    <link
        rel="icon"
        type="image/png"
        href="favicon.png"
    >

    <!-- Eski tarayıcılar -->
    <link
        rel="shortcut icon"
        type="image/x-icon"
        href="favicon.ico"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- CUSTOM CURSOR -->
    <div
        class="custom-cursor"
        aria-hidden="true"
    ></div>


    <!-- BACKGROUND -->
    <div class="background"></div>
    <div class="background-overlay"></div>


    <!-- CLICK TO ENTER -->
    <div id="start-screen">

        <div id="start-text">
            Click To Enter!
        </div>

    </div>


    <!-- PAGE -->
    <main class="page">

        <div class="profile-wrapper">

            <!-- PROFILE CARD -->
            <section id="profile-block">

                <div class="card-shine"></div>


                <!-- PROFILE HEADER -->
                <div class="profile-header">


                    <!-- PROFILE IMAGE -->
                    <div class="profile-container">

                        <div class="profile-orbit"></div>

                        <div class="orbit-particles"></div>

                        <img
                            class="profile-picture"
                            src="https://github.com/TurkdogruDev.png?size=320"
                            alt="TurkdogruDev"
                            draggable="false"
                        >

                    </div>


                    <!-- PROFILE INFO -->
                    <div class="profile-info">

                        <h1 id="profile-name">
                            TurkdogruDev/T.Dev
                        </h1>


                        <!-- ROLE CARDS -->
                        <div class="role-badges">

                            <span class="role-badge">
                                Roblox Developer
                            </span>

                            <span class="role-badge">
                                Web Developer
                            </span>

                            <span class="role-badge">
                                Discord Bot Developer
                            </span>

                        </div>


                        <!-- BIO -->
                        <p id="profile-bio">
                            I dont know what to put but my favorite color is white.
                        </p>

                    </div>

                </div>


                <div class="separator"></div>


                <!-- SOCIAL LINKS -->
                <div class="social-links">


                    <!-- GITHUB -->
                    <a
                        class="social-link"
                        href="https://github.com/TurkdogruDev"
                        target="_blank"
                        rel="noopener noreferrer"
                        draggable="false"
                    >

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M12 .7a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.1c-3.34.73-4.04-1.42-4.04-1.42-.55-1.38-1.34-1.75-1.34-1.75-1.09-.75.08-.73.08-.73 1.21.08 1.85 1.24 1.85 1.24 1.07 1.84 2.81 1.31 3.5 1 .11-.78.42-1.31.76-1.61-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.53.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58A12 12 0 0 0 12 .7Z"
                            />
                        </svg>

                        <span>
                            GitHub
                        </span>

                    </a>


                    <!-- TIKTOK -->
                    <a
                        class="social-link"
                        href="https://tiktok.com/@000.0i1"
                        target="_blank"
                        rel="noopener noreferrer"
                        draggable="false"
                    >

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M16.6 2c.28 2.3 1.58 3.67 3.9 3.82v3.05a8.5 8.5 0 0 1-3.86-.89V14A6 6 0 1 1 11.45 8v3.08a3 3 0 1 0 2.12 2.87V2h3.03Z"
                            />
                        </svg>

                        <span>
                            TikTok
                        </span>

                    </a>


                    <!-- YOUTUBE -->
                    <a
                        class="social-link"
                        href="https://youtube.com/@tugdev"
                        target="_blank"
                        rel="noopener noreferrer"
                        draggable="false"
                    >

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M23.5 6.2a3 3 0 0 0-2.1-2.12C19.55 3.58 12 3.58 12 3.58s-7.55 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.12c1.85.5 9.4.5 9.4.5s7.55 0 9.4-.5a3 3 0 0 0 2.1-2.12A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.25 3.6-6.25 3.6Z"
                            />
                        </svg>

                        <span>
                            YouTube
                        </span>

                    </a>


                    <!-- DISCORD -->
                    <a
                        class="social-link"
                        href="https://discord.com/users/1159431835420467221"
                        target="_blank"
                        rel="noopener noreferrer"
                        draggable="false"
                    >

                        <svg viewBox="0 0 24 24">
                            <path
                                d="M20.3 4.37A16.3 16.3 0 0 0 16.23 3l-.5 1.02a15.1 15.1 0 0 0-7.45 0L7.76 3A16.5 16.5 0 0 0 3.7 4.37C1.13 8.18.44 11.9.79 15.57A16.6 16.6 0 0 0 5.8 18.1l1.2-1.64a10.6 10.6 0 0 1-1.9-.91l.47-.37a11.6 11.6 0 0 0 12.86 0l.47.37c-.61.36-1.25.66-1.9.91l1.2 1.64a16.6 16.6 0 0 0 5.01-2.53c.42-4.25-.72-7.93-2.91-11.2ZM8.18 13.3c-1.22 0-2.22-1.12-2.22-2.5s.98-2.5 2.22-2.5c1.25 0 2.25 1.13 2.22 2.5 0 1.38-.98 2.5-2.22 2.5Zm7.64 0c-1.22 0-2.22-1.12-2.22-2.5s.98-2.5 2.22-2.5c1.25 0 2.25 1.13 2.22 2.5 0 1.38-.97 2.5-2.22 2.5Z"
                            />
                        </svg>

                        <span>
                            Discord
                        </span>

                    </a>

                </div>


                <!-- FOOTER -->
                <div class="profile-footer">

                    <div class="visitor-counter">

                        <svg viewBox="0 0 24 24">

                            <path
                                d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                        </svg>


                        <span id="visitor-count">
                            10,258
                        </span>


                        <span class="views-label">
                            views
                        </span>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- MUSIC -->
    <audio
        id="background-music"
        loop
        preload="auto"
        playsinline
        webkit-playsinline
    >

        <source
            src="music.mp3"
            type="audio/mpeg"
        >

    </audio>


    <script src="script.js"></script>

</body>

</html>
